<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fireporter</title>
</head>
<body>
  <h1>Fireporter</h1>
  <p>Fireporter is a Figma-to-Roblox UI import tool. Connecting your Roblox account lets Fireporter's Live Mode automatically build your Figma UI designs directly inside Roblox Studio.</p>

  <p><a id="connectBtn" href="#">Log in with Roblox</a></p>

  <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>

  <script>
    const BACKEND = "https://fireporter-oauth-eta.vercel.app";

    function generateState() {
      let str = '';
      for (let i = 0; i < 32; i++) {
        str += Math.floor(Math.random() * 16).toString(16);
      }
      return str;
    }

    const state = generateState();
    document.getElementById('connectBtn').href = `${BACKEND}/api/authorize?state=${state}`;
  </script>
</body>
</html>
